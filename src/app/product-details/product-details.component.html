<div class="product">
            <img [src]="getImageUrl()" [alt]="product().name"/>
            <div class="details">
                <div>
                    <h2>{{ product().name }}</h2>
                    <p>{{ product().description }}</p>
                    <p>Part type: {{ product().category }}</p>
                </div>
            </div>
            <div class="price">
                @if (product().discount > 0)
                {
                    <p class="discounted">{{ product().price * (1-product().discount) | currency}} (Sale)</p>
                }
                @else
                {
                    <p class="discounted">{{ product().price | currency}}</p>
                }
                <button class="cta" (click)="addToCart($event)">Buy</button>
            </div>
</div>
